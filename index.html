  <!-- Sin zoom, ocupa también la zona del notch (viewport-fit=cover) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Ane · Rumbo a los 30</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Ane 30">
  <style>@font-face {
  font-family: 'PressStart';
  src: url('fonts/PressStart.ttf') format('truetype');
  font-display: block;
}
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #1b1430; overflow: hidden;
  /* sin scroll, sin zoom, sin rebote, sin selección ni menú de pulsación larga */
  position: fixed; inset: 0;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
/* El lienzo ocupa TODA la pantalla (también bajo el notch); el HUD se aparta con G.safe */
#safe { position: fixed; inset: 0; }
#game { width: 100%; height: 100%; }
#game canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

#hud-buttons {
  position: fixed; z-index: 10;
  flex-direction: column; align-items: flex-end;
  top: calc(env(safe-area-inset-top) + 6px);
  right: calc(env(safe-area-inset-right) + 6px);
  display: flex; gap: 22px;
}
/* Zona de toque >= 44 px sin agrandar el dibujo del botón */
#hud-buttons button { position: relative; }
#hud-buttons button::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: max(100%, 48px); height: max(100%, 48px); }
#hud-buttons button {
  font-family: 'PressStart', monospace; font-size: 9px; color: #fff;
  background: rgba(27, 20, 48, .72); border: 2px solid #fff; border-radius: 6px;
  padding: 6px 8px; cursor: pointer; touch-action: manipulation;
}
#hud-buttons button.on { background: #2e9d4b; }
#btn-mute { font-size: 14px !important; padding: 2px 8px !important; }

#rotate, #loading {
  position: fixed; inset: 0; z-index: 20; display: none;
  flex-direction: column; align-items: center; justify-content: center;
  background: #1b1430; color: #fff; font-family: 'PressStart', monospace;
  text-align: center; line-height: 1.8; font-size: 14px;
}
#loading { display: flex; z-index: 19; gap: 14px; font-size: 12px; }
#loading img { image-rendering: pixelated; }
#loading .track { width: 200px; height: 12px; border: 3px solid #fff; border-radius: 4px; background: #4a3c66; }
#loading-bar { width: 0; height: 100%; background: #ffd23f; transition: width .15s; }
#loading-pct { font-size: 10px; color: #ffd23f; }
#rotate .phone { font-size: 56px; animation: girar 1.6s ease-in-out infinite; }
@keyframes girar { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0); } }
/* Solo en móviles táctiles puestos en horizontal: el juego es vertical */
@media (orientation: landscape) and (pointer: coarse) and (max-height: 540px) {
  #rotate { display: flex; }
}
</style>
</head>
